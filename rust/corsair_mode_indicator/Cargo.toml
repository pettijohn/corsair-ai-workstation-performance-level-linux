[package]
name = "corsair-mode-indicator"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "GNOME performance mode indicator for the CORSAIR AI Workstation"

[dependencies]
corsair-performance-mode-core = { path = "../corsair_performance_mode_core" }
ksni = { version = "0.3.4", default-features = false, features = ["async-io", "blocking"] }
nix = { version = "0.31.3", features = ["poll"] }
