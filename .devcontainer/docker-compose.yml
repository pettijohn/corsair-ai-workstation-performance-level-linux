name: ${DEVCONTAINER_ID:-corsair-ai-workstation-performance-mode-linux-driver}

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: vscode
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    init: true
    volumes:
      - ../..:/workspaces:cached
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    command: sleep infinity
